      - src/game/**
      - tests/e2e/S-06-*.spec.ts
      - process/slices/S-06.md
    acceptance:
      - ホームから潜って工房の試作部屋に立ち、行き止まりの先を覗くと裏の橋が見え、台座に玉を置くと橋が実体化して渡れ、光の雫に触れられる
      - e2e が入力を送って最初から雫まで通しで遊べることを確かめる。両経路で予算内、中品質で負荷シーン以下の重さ

  - id: S-07
    title: M0ゲート判定 — 実機の計測と覗く操作の体感評価
    status: passed-conditional
    passed: 発案者が覗く操作と音を良いと判断。60fps は推奨環境の機械がないため、M5 Pro の4倍の画素数（DPR=2）で近似して中品質 p95 4.0ms（目安 13.3ms）。推奨環境の実機での確認は M1 のテストプレイへ（発案者の選択、2026-10-21。process/slices/S-07.md）
    depends: [S-06]
    human: true
    acceptance:
      - 推奨環境に近い内蔵GPUのノートPC（Apple M1、Intel Iris Xe 相当）で、負荷シーンと試作部屋が中品質60fps
      - 発案者が試作部屋を遊び、覗く操作が気持ちいいと判断する。だめなら何が足りないかを記録して設計に戻す
      - （S-19 から）行き止まりから見た5m先の光の雫が、光として読めるか。読めなければ光の輪を足す（S-19 は保留中）
      - （S-16・S-17・S-18 から）音の耳での確認項目と判断待ち（process/slices/S-16.md・S-18.md。下ろすときの音、雫の音の高さ、ホームの雫の残響など）と、実体化の波面の光の強さ（S-17 の判断待ち2）を見て決める

  # M0 の残りを待つ間に並べて進めるスライス（2026-10-21 追加）
  - id: S-08
    title: GPU のフレーム時間を正しく測る（最初のパスの開始から最後のパスの終わりまで）
    status: integrated
    branch: slice/S-08-gpu-span
    accepted: 発案者がレビュー2巡の上限で受け入れ（2026-10-21）。止めっぱなしの件は S-11
    depends: [S-05]
    requirements:
      - 技術設計 > 品質プリセット（プレイ中も負荷に応じて描画解像度を動的に調整）
    paths:
      - src/core/perf/**
      - src/core/renderer.ts
      - src/core/params.ts
      - src/core/params.test.ts
      - src/core/scene.ts（約束のコメントだけ）
      - src/main.ts
      - scripts/bench-*.mjs
      - tests/e2e/S-08-*.spec.ts
      - tests/e2e/S-05-perf.spec.ts（dynresResponse=0 の明示だけ）
      - process/slices/S-08.md
      - src/core/CHANGELOG.md
    acceptance:
      - WebGPU で、フレームの最初と最後に自前のタイムスタンプを置き、その差を GPU のフレーム時間として取れる。three の描画パスの合計とは別に持つ
      - 静かな状態で、GPU が律速する負荷のシーンでは、垂直同期なしのフレーム時間と同程度以下であることを Apple の機械で確かめる（毎秒数千フレームのほぼ空のシーンでは前後のフレームが重なって長く出る。既知の例外）
      - 妥当なら Apple でも動的解像度を GPU 時間で動かせるようにする。妥当でなければ理由を記録して止める

  - id: S-09
    title: 音の基礎 — 音階、ガラスの音（合成）、ビードロの「ぽぺん」、立体音響と残響
    status: integrated
    branch: slice/S-09-audio
    accepted: 発案者がレビュー2巡の上限で受け入れ（2026-10-21）。耳での確認は発案者に依頼中
    depends: [S-00]
    parallel: true
    requirements:
      - サウンドデザイン > 音階の統一
      - サウンドデザイン > ガラスの音
      - サウンドデザイン > 環境音（立体音響、空間ごとの残響）
      - サウンドデザイン > 制作方法（シンセサイザーで補う、音量の4系統）
      - UI/UX設計 > 画面ごとの設計（読み込み：操作があるまで音を鳴らせない）
    paths:
      - src/core/audio/**
      - src/audio/**
      - src/scenes/audio-lab.scene.ts
      - tests/e2e/S-09-*.spec.ts
      - process/slices/S-09.md
      - src/core/CHANGELOG.md
    acceptance:
      - D メジャー・ペンタトニック（D E F# A B）の音程の計算と、大きさから音程を選ぶ規則（大きいほど低い、音階に揃える）が純粋関数として単体テストされている
      - 音の基盤：最初の操作で開始する AudioContext、全体/音楽/効果音/環境音の4系統の音量、HRTF の立体音響、空間ごとの残響（狭い工房は短く、ドームは長く。残響は合成で作る）
      - ガラスの音を合成で作る：触れる・叩く・玉が当たるの3段階の強さ × 大きさ。ガラスらしい非整数倍の倍音と減衰
      - 手の玉の「ぽぺん」（長崎のビードロのような短い二音）を、覗く・置く・拾う・震えるの4種で鳴らせる
      - audio-lab シーンで、大きさの違うガラスを鳴らし、音源が周りを回る立体音響を確かめられる
      - センサー：OfflineAudioContext で音を書き出し、無音でないこと、基音が狙った音階の音から ±3% 以内であることを e2e で確かめる。両経路でエラーなし

