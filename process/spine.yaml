    acceptance:
      - 承認された配置を作る：作業台とビードロ（既存の位置）、炉（既存の位置。工房で唯一の暖かい光）、炉の前の真鍮の格子の床、吹き竿の立て掛け（1本は炉の口に差したまま）、マーバー台と作りかけの器、奥の徐冷炉と冷ましている作品（中がほのかに暖かい）、左奥の壁沿いの弧の作品の棚（瓶・器・ビードロ）、椅子と飲みかけの湯のみ、水桶、扉の上の風鈴
      - Blender をスクリプトで動かして造形し（瓶や器は曲線の回転、炉は泡の形、角を作らず真鍮の枠だけを直線にする）、pnpm assets で glb にして読み込む。命名は設計書の表、小物は500〜3000三角形でアトラスを共有、材質は設計書のガラスの種類（気泡入り・乳白・透明・曇り）と真鍮。透過の材質は S-12 の決まりに従う
      - 当たり判定は見た目に正直に（_col）。e2e で、目覚める位置から作業台の玉を拾い、扉を出て一本道へ歩けること、S-06・S-16・S-22 の通しの e2e が緑のままであることを確かめる。真鍮の格子を FLOOR_ZONES に足し、そこで足音が真鍮になる
      - 目覚めて最初の絵：作業台の上の玉に天窓からの夜明け前の青い光が落ち、視界の右に炉の暖かい光が入る。決まった視点（目覚め、炉の前、作品の棚、扉から振り返る）のスクリーンショットを両経路で撮って記録し、見た目の最終判断は発案者に仰ぐ。焼き込み（ライトマップ、光の模様）は入れない（S-26）
      - 重さ：描画呼び出しと三角形の増分を記録し、予算内。中品質で試作部屋が負荷シーン以下の重さ（同じ実行の中の相対値。最終は親の QUIET=1 の計測）。両経路でエラーなし、backdrop-risks のセンサーが緑
