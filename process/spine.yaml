      - 覗く像の遠端：覗いている間、立っている所から 150m より先に丸ごとある物を覗く像に描かない。ただし目印（灯塔、工房街の煙突。後のエリアの雫塔と温室も同じ印で）は遠くても描く。中庭の台座 A で町の方を向いて覗いたときの描画呼び出しを下げ（S-41 で 274 回、目安 210 回以下）、坂の上の峠から東の煙突を覗いたとき玉の中に煙突が残る（e2e）。裏の層は外さない（`probe.peekFar.leftOutBack` が 0）
