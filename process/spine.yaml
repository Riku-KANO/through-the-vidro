      - 部屋1「崩れた壁の路地」（表だけの壁を安全な場所で単独で）：入口の広場から東へ上る坂の下。路地が崩れた壁（表の層だけ）でふさがれ、手前に台座がある。覗くと玉越しでは壁が消えて、奥に雫の光が見える。置くと球の中で壁が消え（S-28 の区画を切る仕組み）、通り抜けて雫に触れて取れる。玉を拾えば壁は戻る。壁が球に丸ごと入り、雫が球の中にあることを単体で確かめる。雫を取ると、次の部屋の方向が見える（部屋2はまだないので、坂の先は仮の行き止まりと理由）
      - エリアの読み込み：エリア1は中央広場にいる間に裏で組み立てて温める（S-38 の withGlassUnculled。エリア1の透過のガラスのパイプラインは見える前に作り終える）。その間も遊ぶ間の最長フレームは S-06 の上限 200ms 未満、目安 50ms 以下。読み込み画面の温めのフレームの描画呼び出しは 300 以下に保ち（S-35 の後で 281〜283。エリア1を足しても超えない作りにする）、その1フレームの長さに上限（目安1秒）を置くセンサーを足す（S-38 の発案者の判断）
      - 形は灰色の箱（コードの簡単な形。泡と曲面、真鍮の枠の形のルールには沿う）。エリア1は朝で、太陽は夜明けの側（S-39 の後の東）。Blender の作り込みと焼き込みは後のスライス
      - 音：エリア1の環境音（朝の風、遠くの風鈴など）と石畳の足音を合成で仮置きする。足す場所には自分の乱数の流れを持たせる（S-25）
      - e2e：通しの台本（S-06 の autoplay と入力）を、中央広場 → 東の道 → 入口の広場 → 部屋1の雫を取るまで伸ばして両経路で緑。S-16・S-22・S-25・S-28・S-34・S-35・S-38・S-39 の e2e は緑のまま。描画呼び出しと三角形は予算内（入口の広場、部屋1で覗いたとき）
      - 見た目の確認：東の道の途中（空が移るところ）、入口の広場から煙突を見上げる、部屋1で覗いた玉越しの雫、の3視点を両経路で撮って Read で見る。最終判断は発案者

