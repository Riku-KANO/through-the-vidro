# 開発スパイン: スライスの台帳。status は統合時に親セッションが更新する。
# 各スライスの進捗・計測値・判断待ちは process/slices/<id>.md に書く。
# status: todo | red | green | reviewed | integrated | blocked | closed（調べ終えて、作らないと決めた）
# requirements は docs/design-snapshot.md の節名（「大見出し > 小見出し」）。
# paths はそのスライスが編集してよい範囲。範囲外の変更は記録ファイルに提案として書く。
version: 1
milestone: M0 技術検証
gate: 中品質で60fps、覗く操作が気持ちいいと確認できる

slices:
  - id: S-00
    title: 足場とループの仕組み（Vite+TS+Three.js WebGPU+Rapier、センサー、スパイン）
    status: integrated
    branch: main
    paths: ['*']
    notes: process/slices/S-00.md

  - id: S-01
    title: ガラス材質ライブラリと見本のシーン
    status: integrated
    branch: claude/slice-s-01-glass-254305
    depends: [S-00]
    parallel: true
    requirements:
      - アートディレクション > ガラスの種類
      - アートディレクション > 形のルール
      - 技術設計 > ガラスの描画
      - 技術設計 > 品質プリセット
      - 空間の可読性と導線 > 歩ける場所を読ませる（1, 2）
      - 空間の可読性と導線 > 画面をうるさくしない（8）
    paths:
      - src/core/glass/**
      - src/scenes/glass-gallery.scene.ts
      - tests/e2e/S-01-*.spec.ts
      - process/slices/S-01.md
      - src/core/CHANGELOG.md
    acceptance:
      - 6種のガラス（透明・曇り・色[琥珀/瑠璃/翡翠]・気泡入り・虹色・乳白）を作る関数がある。屈折率1.5、透明は粗さ0、曇りは粗さ0.4〜0.6、色は表面ではなく内部の吸収で出し、厚い所ほど濃い
      - 透明ガラスは視線に斜めの面ほど強く反射し（フレネル）、断面の縁にわずかな緑が入る
      - 遠景用の安価なガラス（透過なし、環境マップの反射＋距離の霞）があり、品質プリセットの farGlassTransmission で透過と切り替わる
      - 分散と薄膜干渉は品質プリセットの dispersion に従って有効・無効が決まる（純粋関数で単体テスト）
      - 見本のシーンに、泡が溶け合った形の建物（球の集合で代用）、真鍮の細い枠、全種類のガラス、曇りガラスの床がある
      - 見本のシーンが両経路で予算内、エラーなし。スクリーンショットで縁が読め、一枚絵として成立している

  - id: S-02
    title: 表と裏の層 — 覗く（裏の層の合成）と置く（実体化）
    status: integrated
    branch: claude/slice-s-02-layers-542800
    depends: [S-00]
    parallel: true
    requirements:
      - コアメカニクス > 基本の動作
      - コアメカニクス > 裏の層のルール
      - コアメカニクス > ガラス玉の性質の成長（小玉の半径2m）
      - 技術設計 > 1フレームの描画の流れ（4, 5）
      - 技術設計 > 裏の層の実装
      - トランジション設計 > 遷移の一覧（覗く開始・終了、玉を置く）
      - 操作とカメラ > カメラ（覗いている間の視野角 -6度）
      - アートディレクション > 画面の仕上げ（色収差と被写界深度は覗いている間・玉越しだけ）
    paths:
      - src/layers/**
      - src/game/orb/**
      - src/scenes/layers-lab.scene.ts
      - tests/e2e/S-02-*.spec.ts
      - process/slices/S-02.md
    acceptance:
      - 物を表・裏・共通の層に割り当てるAPIがある。置かれた玉（最大3つ：主玉4m＋小玉2m×2）の球の中では表を描かず裏を描き、境目が光る膜として見える
      - 置く操作で実体化の半径が0から4mへ0.8秒で広がり、波面が光る。拾うと逆に戻る
      - 覗く操作で、裏の層を品質プリセットの peekScale の解像度で別画像に描き、手の玉の屈折に沿って表と裏を合成する。開始・終了は0.25秒。覗いている間は視野角-6度、色収差は玉越しだけ
      - 規則（純粋関数で単体テスト）：置いている間は覗けない / 実体化した裏の足場の上にいるときは拾えない / 球と重なる裏の足場の区画だけ当たり判定が有効 / 覗いている間の移動速度は50%（値として公開）
      - layers-lab シーン（カメラは固定経路か簡易操作でよく、S-03 に依存しない）で、行き止まりの先に裏の橋があり、覗くと見え、台座に置くと実体化する。?demo=1 で台本どおりに覗く→置くを再生する
      - sceneProbe に peeking・peekAmount・spheres を出し、e2e で入力を送って状態を確かめる。両経路で予算内

  - id: S-03
    title: 一人称の移動と入力（キーボード＋マウス、ゲームパッド）
    status: integrated
    branch: claude/slice-s-03-player-e1c811
    depends: [S-00]
    parallel: true
    requirements:
      - 操作とカメラ > 入力の割り当て
      - 操作とカメラ > カメラ
      - 操作とカメラ > 3D酔い対策
      - コアメカニクス > 基本の動作（歩く）
      - 空間の可読性と導線 > 歩ける場所を読ませる（4 当たり判定は見た目に正直に）
    paths:
      - src/game/player/**
      - src/game/input/**
      - src/scenes/walk-lab.scene.ts
      - tests/e2e/S-03-*.spec.ts
      - process/slices/S-03.md
    acceptance:
      - 動作（移動・視点・覗く・置く/拾う/調べる・鳴らす・小玉の切り替え・早歩き・ポーズ）とキーボード＋マウス／ゲームパッドの既定の割り当てが、設計書の表どおりにデータとしてある。割り当て直せる形で、覗くは長押し／切り替えを選べる
      - クリックで Pointer Lock、Esc で解除
      - Rapier のキャラクター制御で、目の高さ1.6m、歩行1.4m/s、早歩き2.2m/s、短い慣性、段差の自動昇降、丸い壁に沿って滑らかに流れる、足場の縁でやわらかく止まり落ちない
      - 視野角70度（60〜100度の設定）、歩行の揺れはごく弱く設定でオフにできる
      - S-02 と統合するための口がある：移動速度の倍率（覗く=0.5）、視野角の加算（覗く=-6度）、入力イベント（覗く・置く）
      - walk-lab シーン（段差・斜面・縁・丸い壁・高台）で、sceneProbe に位置・速度・接地を出す。e2e で W を2秒押すと約2.8m進む、縁から落ちない、段差を上れることを確かめる

  - id: S-04
    title: 読み込み → ホーム → 玉の中へ潜る遷移
    status: integrated
    branch: claude/slice-s-04-home-dive-09c08e
    depends: [S-00]
    parallel: true
    requirements:
      - UI/UX設計 > 画面ごとの設計（読み込み、ホーム）
      - UI/UX設計 > 細部の振る舞い
      - トランジション設計 > 遷移の一覧（読み込み→ホーム、ホーム→ゲーム開始）
      - トランジション設計 > 遷移のルール
      - 世界観とストーリー > 結末（4 ホームの玉と同じ構図）
    paths:
      - src/ui/**
      - src/core/transition/**
      - src/scenes/home-dive.scene.ts
      - tests/e2e/S-04-*.spec.ts
      - process/slices/S-04.md
      - src/core/CHANGELOG.md
    acceptance:
      - 読み込み画面：白い霧の中の小さなガラスの器が、読み込みの進み具合に合わせて光で満ち、満ちたら「はじめる」が浮かぶ。クリックで開始（音の再生許可を得る口を用意）
      - ホーム画面：中央の大きなガラス玉の中に街の縮図（泡の形の仮置き）が実際の3Dで屈折して見え、マウスに合わせて玉がわずかに傾く。周りに項目の雫（はじめる / つづきから / 残響 / 設定 / クレジット）が浮かび、ホバーで膨らむ。キーボードだけでも選べる
      - ホーム → ゲーム開始（2.0秒）：カメラが玉へ近づき、表面を通り抜ける瞬間に屈折の歪みが画面いっぱいに広がり、そのまま工房（仮置き）の中に立っている。黒い画面を使わない。玉の中身はゲーム側のシーンそのもの
      - 読み込み → ホーム（1.5秒）：器が満ちて溢れ、霧が晴れ、奥から玉が浮かぶ
      - 全遷移で共通の動きの曲線（ゆっくり始まり、粘りながら止まる）が src/core/transition にあり単体テストがある。0.5秒を超える遷移の間も Esc を受け付ける
      - ?autoplay=1 で台本どおりに再生し、e2e が遷移の途中の複数の時点のスクリーンショットを撮る。両経路で予算内

  - id: S-05
    title: 性能 — 負荷シーン、品質の自動選択、動的解像度、実機計測
    status: integrated
    branch: slice/S-05-perf
    depends: [S-00]
    parallel: true
    owner: 親セッション
    requirements:
      - 技術設計 > 性能の目標と予算
      - 技術設計 > 品質プリセット
      - 技術設計 > 開発用ツール（性能表示）
    paths:
      - src/core/perf/**
      - src/core/renderer.ts
      - src/core/params.ts
      - src/core/params.test.ts
      - src/core/bench.ts
      - src/core/bench.test.ts
      - src/core/VERSION
      - src/dev/**
      - src/main.ts
      - src/scenes/stress.scene.ts
      - scripts/bench-*.mjs
      - scripts/lib/**
      - tests/e2e/S-05-*.spec.ts
      - process/slices/S-05.md
      - src/core/CHANGELOG.md
    acceptance:
      - 負荷シーン：M0で最も重い場面の見積もり（近景の透過ガラス20個、描画呼び出し約250回、三角形約120万、遠景の安価なガラス多数）を作り、両経路で計測する
      - 品質の自動選択：最初の10秒のフレーム時間から推奨プリセットを選ぶ純粋関数と単体テスト。?quality= で上書きできる
      - 動的解像度：負荷に応じて描画解像度を上下させる制御（ヒステリシス、上下限）の純粋関数と単体テスト。アプリに組み込む
      - 性能表示に GPU メモリ（テクスチャ・形状）を足す
      - ヘッドありブラウザでの実機計測スクリプト（scripts/bench-headed.mjs）が全シーンを各品質で測り、表を artifacts/bench-headed.md に書く

  - id: S-06
    title: M0統合 — 序章の試作部屋（歩く→覗く→置く→渡る→雫）
    status: integrated
    branch: slice/S-06-prologue
    accepted: 発案者がレビュー2巡の上限で受け入れ（2026-10-21）
    depends: [S-01, S-02, S-03, S-04, S-05]
    requirements:
