  - id: S-38
    title: 工房の奥の透過の小物を読み込みの中で温める — 振り返ったときの初めてのコンパイルの止まりをなくす
    status: integrated
    accepted: レビュー2巡で P1 なし、2巡目の P2（ガラスの下の物が温まらない見込み）は直した。look-back の最長は WebGPU 36〜52 → 19ms、WebGL2 53〜64 → 19〜23ms、作られるパイプラインは 5 → 0。発案者の判断で、読み込み中の温めの1フレームが長くなる件（WebGPU 0.43 → 0.55秒、WebGL2 0.51 → 0.72秒）は許し、そのフレームの長さに上限の見張りを後で足す（S-36）。S-06 の段ごとの判定 max(30ms, 中央値×1.5) はこのまま。core 0.12.0（2026-10-25）
    depends: [S-34]
