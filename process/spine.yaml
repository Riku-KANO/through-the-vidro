  - id: S-11
    title: 動的解像度の止めっぱなしの解消と、センサーの警告の数え上げ
    status: integrated
    branch: slice/S-11-dynres-resume
    accepted: 発案者がレビュー1巡目の後に受け入れ（試行の上限、2026-10-21）。揺れへの強さは S-13
    depends: [S-08]
    requirements:
      - 技術設計 > 品質プリセット（プレイ中も負荷に応じて描画解像度を動的に調整）
    paths:
      - src/core/perf/**
      - src/main.ts
      - src/core/params.ts
      - src/core/params.test.ts
      - tests/e2e/scenes.spec.ts
      - tests/e2e/S-11-*.spec.ts
      - scripts/bench-*.mjs
      - process/slices/S-11.md
      - src/core/CHANGELOG.md
    acceptance:
      - 手応えの検査で止めた後も、GPU 時間が止めた時点の水準から3割以上上がったら（新しい重さ）、検査を数え直して動的解像度を再開する。再開の回数には上限を置き、行き来を防ぐ。止まった・再開したの理由を probe に出す。単体テスト（途中から重くなる、垂直同期の下で軽い負荷が揺れる、一定の重さ）
      - 静かな実機の閉ループ（scripts/bench-dynres.mjs、垂直同期あり、GROW_AT で途中から重くする）で、軽い負荷で止まった後に重くなったら再開して下げることを確かめる
      - ブラウザセンサー（scenes.spec.ts）が console の warning も数え、既知の警告だけを許す一覧で管理する。WebGL2 の three r186 のタイムスタンプのプールの警告（beginQuery：a query is already active）がまだ出るなら main.ts 側で直し、S-06 のシーン側の回避策を消せるようにする

