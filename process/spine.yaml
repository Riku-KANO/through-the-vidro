      - 部屋は順に開く：部屋1の雫で部屋2への道が開き、部屋2の雫で部屋3への道が開く。開く見せ方は序章の門と同じ形のルール（真鍮とガラス、雫の光が届いてから開く）で、音を添える（room.events に新しい種類を足さない）。開く前の道の端は行き止まりの理由を持つ（ルール9：門の向こうに次の場所の気配が見える）。灯りと光の粒は、いつもまだ雫を取っていない次の部屋へ向く。順の判定は純粋関数にして単体で確かめる
      - 部屋3：雫を屋根の陰に置き、台地や屋根の上からは見えず、谷の端から覗いたときだけ見通せる配置にする。どちらの台座に置いた後も雫は見えない（置くと覗けないので、覚えておくしかない）。間違えた方に置いても玉を拾えばやり直せる。e2e で、端から覗くと雫の画素が出て、両方の台座に置いた状態の視点では出ないことを確かめる
      - 近道の光の出だしと止まりを glassEase（遷移のルール5）に合わせる
      - 覗く像に遠い物を描かない：覗く像のパスで霧の向こうの物（霧の遠端より先）を描かず、中庭の台座 A で町の方を向いて覗いたときの描画呼び出し（S-40 で 266 回）を下げる。玉越しの裏の層の見た目は変えない
      - e2e：S-06・S-36・S-40 の通しと autoplay（エリア1の3部屋と近道まで）は両経路で緑のまま。描画呼び出しと三角形は予算内。読み込みのフレームの描画呼び出し（280・281）と長さ（1 秒未満）を増やさない
      - 見た目の確認：開く前と開いた後の道、部屋3を台地から見た絵と端から覗いた絵を両経路で撮って Read で見る。最終判断は発案者

  - id: S-42
    title: ポーズ画面 — 時間がゆっくり止まり、曇りが広がって文字が書かれる。つづける・タイトルへ（確認つき）
    status: integrated
    accepted: 発案者が上限（レビュー2巡）で受け入れ。残った P1（開いたときに鳴っている出来事の音が最後まで鳴る）は、発案者の判断で sound.ts に時間の速さの口を足して直し、追加のレビュー1巡（3巡目）で P1 なし。見た目と手触り、タイトルへ戻った後の「はじめる」が続きから（セーブまで）、ホームでは環境音を消す、はこのまま。room.ts・dive-host.ts が spine の用途より広がったのは統合で追認。全検査は実時間の音の6件（スリープ後の環境、main でも同じく落ちる）を除いて緑（2026-10-28）
    depends: [S-40]
    parallel: true
    decided: 発案者の判断（2026-10-27）。M1 の主要画面のうち、ポーズと設定を S-41 と並べて進める。設定パネルは S-43 で、ポーズの「設定」はそこでつなぐ。ヒントと地図の玉の項目は、その仕組みを作るスライスで足す
    requirements:
      - UI/UX設計（UIの原則1〜5、文字と色、画面ごとの設計：ポーズ、細部の振る舞い：ホバーと選択・キーボード・パッド操作・戻る操作・確認ダイアログ）
      - トランジション設計（遷移の一覧：ゲーム → ポーズ 0.4秒＋文字0.3秒、ポーズ → ゲーム 0.3秒。遷移のルール1 黒い画面を使わない、3、4、5、6 音を必ず添える）
      - 操作とカメラ（入力の割り当て：ポーズは Esc・Start。Pointer Lock は Esc で解除する）
    paths:
      - src/ui/pause/**（新規。ポーズの見た目・項目・確認・状態）
      - src/ui/lang/*.json、src/ui/styles.ts、src/ui/flow.ts（遷移の口が要るとき）、src/ui/home/**（ホームへ戻る口だけ）
      - src/game/prologue/room.ts（ポーズの配線と時間の速さだけ。並行の S-41 も触るので広げない）
      - src/audio/**（ポーズの音、ポーズ中に絞る音）、src/game/prologue/sound.ts（時間の速さの口。発案者の判断で追加）、src/ui/home/dive-host.ts（ポーズの持ち主。統合で追認）
      - src/scenes/prologue-proto.scene.ts（先頭のコメントだけ）
      - src/core/transition/**（要るときだけ。CHANGELOG に記録）
      - 上の単体テスト、tests/e2e/S-42-*.spec.ts
      - process/slices/S-42.md
    acceptance:
      - 開く：遊んでいるとき、Esc（マウスの固定が外れたときも）と Start でポーズを開く（入力は今も 'pause' を出している。src/game/input）。ゲームの時間の速さが 0.4 秒かけて glassEase で 1 → 0 になり（体・玉・光の掃き・環境の動きがゆっくり止まる）、息を吹きかけたような曇りが画面の中心から広がり、項目が指でなぞった文字（文の左から右へ光の筆跡が進む）で 0.3 秒かけて書かれる。黒い画面は使わない。入力から 0.1 秒以内に音と動きで応え、遷移に固有のガラスの音を添える
      - 項目：つづける / タイトルへ。マウス（ホバーで膨らんで鳴る、選ぶと沈み込む）、キーボード（上下・Enter）、ゲームパッド（十字・A・B）で操作でき、フォーカス中の項目は光と音で分かる。項目の判定と移り変わりは純粋関数にして単体で確かめる
      - 戻る：つづける・Esc・B で、曇りが外側から 0.3 秒で晴れて時間が動き出す（開くときの逆再生）。マウスの固定は、ブラウザの決まりで Esc の直後に固定し直せないことがあるので、クリックで戻せることを曇りガラスの小さな文字で示す
      - タイトルへ：取り消せない操作なので確認する（曇りガラスに2択の文字）。はいなら、黒い画面を使わずにホームへ戻る（潜る遷移の逆再生を目指す。難しければ、曇りが画面を覆って晴れるとホームの玉の前、を仮置きにして判断待ちに書く）。戻ったホームから「はじめる」でもう一度遊べ、ページの AudioContext と音のエンジンは1つのまま（S-18）
      - 音：ポーズ中はゲームの音を絞る（環境音は小さく残し、足音と出来事は止まる）。再開で戻る
      - 文字：本文は明朝体（ホームと同じ書体）、文字の背後は曇らせる（白 10〜18% の濃さとぼかし）、最小 18px（1080p 基準）。日本語と英語（lang の JSON）。英語で文字が長くなっても曇りガラスの札が伸びる
      - 性能：ポーズ中は GPU を使い続けない（止まった画面を保ったまま描画を止めるか軽くする）。開閉で長いフレームを作らない（最長 50ms 目安）
      - e2e（両経路）：遊んでいる間に Esc で開き、時間が止まる（体の位置と光の掃きの進みが変わらない）、つづけるで戻る。タイトルへ → 確認 → ホーム → はじめる で再び遊べ、AudioContext は1つ。キーボードだけで操作できる。KNOWN_CONSOLE に新しい警告を足さない
      - 見た目の確認：開いている途中、開いた後、確認の3枚を両経路で撮って Read で見る。最終判断は発案者

  - id: S-44
    title: 部屋3の端と覗く像の遠端 — 覗ける端を広く谷の正面に、目印を残して覗く像の遠端を 150m に
    status: integrated
