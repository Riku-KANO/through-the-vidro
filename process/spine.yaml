    plan: 発案者が承認した配置（2026-10-22、平面図は会話で共有）。ドームの中心を原点、扉は -Z。家具は壁沿いに寄せ、目覚める位置（作業台の前）から扉までの歩く線と、天窓の下の中央は空ける
    paths:
