      - S-06 の autoplay の段ごとの最長フレーム（S-34 が足した probe.autoplay.steps）で、振り返る段 look-back の最長がほかの段と同じくらい（目安 30ms 以下）になることを確かめる。混雑の中でも 200ms から十分な余裕
      - 読み込みの時間の増分を記録する。両経路でエラーなし、S-06・S-24〜S-34 の e2e は緑のまま

  - id: S-39
    title: 東西を夜明けに合わせる — エリア1を夜明けの光の側へ、坂の入口の膜を乳白に、玉のささやき
    status: integrated
    accepted: レビュー2巡で P1 は1巡目の1件（光の粒の行き先の符号）を直し、2巡目は P1・P2 なし。東 = +X（坂を下りる右手）、坂の上から煙突は右 42 度、夜明けは右 51.5 度。膜は乳白（色相の変化 6.2 度）。玉のささやきは `room.hints` のバスで、発案者の判断で間を 3.2 → 6 → 12 秒と広げる（統合で直した）。膜の曇りはこのまま、ヒントをオフにしてもささやきは止めない。S-37 の描画呼び出しの基準を S-39 の世界で測り直した（S-26 の glb で目覚め 89・炉 61、S-37 と同じ）（2026-10-25）
    depends: [S-35]
    decided: 発案者の判断（2026-10-25、S-35 の判断待ち1・3・4）。工房の空と焼いた太陽（夜明けの光）は坂を下りる右手にあるので、ゲームの中の東西を入れ替えてエリア1を右手（夜明けの側）に置く。工房の焼き込みと空は変えない（地図の図とは左右が鏡写しになる）。坂の入口の膜は乳白の曇りガラス（虹色は裏の層と光の雫の色）。膜で止まったら、台座の玉が光るのに添えて小さく鳴る（ヒント設計「玉のささやき」）
    requirements:
      - 進行構造とエリア設計（街の配置と序章の締め、設計書 rev 49）
      - 空間の可読性と導線（6 次の場所が先に見える）
      - ヒント設計（玉のささやき）
      - アートディレクション（光と時間帯、色の役割：虹色は裏の層）
    paths:
      - src/game/prologue/layout.ts（方角と街・広場の門・遠景の位置）、slope.ts、plaza.ts、physics.ts、session.ts、room.ts（配線）
      - src/game/prologue/room-art.ts（古い街の分岐 `town !== false` と townGlass を消す分。S-35 の提案3）
      - src/game/prologue/sound.ts、src/audio/**（玉のささやき。遠くの風鈴の位置は変えない）
      - src/scenes/prologue-proto.scene.ts（先頭のコメントの spawn 名。S-35 の提案2）
      - 上の単体テスト、tests/e2e/S-39-*.spec.ts、tests/e2e/S-35-*・S-06-*・S-34-*（向きが変わる分だけ）
      - process/slices/S-39.md
    acceptance:
      - 東西：坂を下りると、右手に夜明けの暖かい地平線と、エリア1の工房街の煙突と丘が同じ側に見える。広場の開いた門（エリア1）は夜明けの側、閉じた西の門（温室）はその反対、南の門（水路）は正面の奥のまま。工房は広場の真北のまま。工房の焼き込みと空（DAWN）は変えない。坂の上から煙突と夜明けが同じ側にあることを単体（layout.test.ts）で確かめる。S-36 への引き継ぎの方角（東 = −X）を書き直す
      - 膜：坂の入口の光の膜を乳白の曇りガラス（UI と同じ）にし、虹色を使わない。止まる振る舞いと、玉を拾えば消えることは S-35 のまま
      - 玉のささやき：膜で止まって台座の玉が光るのと同時に、玉の方角から小さなガラスの鳴りを合成で仮置きする（bank.ts の口、録音に差し替えられる形）。room.events には入れず、締めの音と同じく別のバスで流す（AGENTS.md、S-34）。呼ぶ光と同じヒステリシスで鳴り始め、繰り返すときは間を置く。e2e で鳴ることを確かめる
      - 古い街の分岐（S-35 の提案3）を消し、広場の上に2本目の灯塔が出ないことを確かめる
      - e2e：S-06 の入力と autoplay、S-34・S-35 の通しは両経路で緑のまま。見た目の確認：S-35 の3視点（坂の上から、広場から灯塔、広場から東の門）と膜の前を撮り直して Read で見る。最終判断は発案者

  - id: S-40
    title: エリア1の部屋2・3と近道 — 二つの台座の中庭、煙突の見晴らし、3つ目の雫で頂から入口の広場への裏の階段が定着する
    status: integrated
    accepted: レビュー2巡で、1巡目の P2 7件を直し、2巡目は P1・P2 なし。全検査 ALL OK。霞から現れる間の最長フレーム 19.7〜20.7ms、読み込みのフレームは 280・281 回で S-36 から増えない。範囲外の src/game/orb/rules.ts（PickUpContext.settled、受け入れ条件そのもの）は統合で追認して paths に足した（2026-10-27）
    depends: [S-36]
