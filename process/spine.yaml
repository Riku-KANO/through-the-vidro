      - 音源の口を「合成」と「録音のファイル」で同じにし、後で録音に差し替えられる（差し替えの手順を記録する）
      - センサー：OfflineAudioContext で各合成音が無音でなく、風鈴の基音が音階から±3%以内。e2e で歩いた経路の床の材質と足音の列が合い、環境音の音源が鳴っている。両経路でエラーなし、描画の重さは変わらない
      - 耳での確認項目（音量の釣り合い、足音の間、風鈴の頻度）を記録に書き出す

  - id: S-23
    title: Blender パイプラインの土台 — 命名検査・ポリゴン数・2つ目のUV・書き出し・圧縮と、ゲームでの読み込み
    status: integrated
    branch: slice/S-23-blender-pipeline
    accepted: レビュー2巡で P1・P2 なし。core 0.9.0（assets/）、blender/scripts/common 0.2.2（2026-10-22）
    depends: [S-01, S-02]
    parallel: true
    requirements:
      - Blenderアセットパイプライン（流れ、命名規則とゲーム情報、書き出しと圧縮、ポリゴンとテクスチャの予算、自動化）
      - 技術設計（アセット圧縮：glTF ＋ meshopt ＋ KTX2）
      - ディレクトリ構成（public/assets、blender/scenes、blender/scripts、common は案2と共通）
    paths:
      - blender/**（scripts/common は案2と共通。VERSION と CHANGELOG を持つ）
      - scripts/assets/**（Blender を画面なしで動かす入口と、gltf-transform の呼び出し）
      - package.json、pnpm-lock.yaml（@gltf-transform/cli を開発用に足すことと、スクリプトの登録だけ）
      - public/assets/**
      - src/core/assets/**（glb の読み込み。src/core/CHANGELOG.md に記録）
      - src/game/assets/**（命名規則とカスタムプロパティから層・当たり判定・台座を組み立てる）
      - src/scenes/asset-lab.scene.ts（新規。書き出した見本を表示する）
      - tests/e2e/S-23-*.spec.ts
      - process/slices/S-23.md
    acceptance:
      - コマンド1つ（例 pnpm assets）で、Blender を画面なしで起動し、.blend から命名規則の検査（設計書の表）、ポリゴン数の報告（予算の表と照合）、2つ目のUVの生成、glb の書き出し（透過・屈折率・吸収・スペキュラーの拡張）までを行う。Blender の場所は環境変数で変えられ、既定は /Applications/Blender.app
      - 書き出した glb を gltf-transform で meshopt 圧縮し、テクスチャを KTX2 に変換する（toktx がなければ止めずに警告して残す）。エリアごとに1ファイル＋共通1ファイルに分けられる作り
      - ゲーム側で glb を読み込める（GLTFLoader ＋ meshopt ＋ KTX2、両経路）。名前の _front/_back/_col と extras（台座の実体化半径など）から、層・当たり判定・台座を組み立てる。名前の解釈は純粋関数で単体テストする
      - スクリプトで作った小さな見本（床・真鍮の枠・台座・ガラス）を通しで書き出して asset-lab シーンで表示し、ブラウザセンサーで両経路エラーなし・予算内。check.sh は Blender のない環境でも緑のまま（パイプラインの検査は別のコマンド）
      - 焼き込み（ライトマップ、コースティクス、環境画像）は入れない（次のスライス）。入れない理由と次の手順を記録する

  - id: S-24
