    acceptance:
      - 部屋2「二つの台座の中庭」（二重の台座と表だけの壁の組み合わせ）：中庭に台座 A・B。A に置くと裏の階段でバルコニーへ上がれるが、奥の表だけの壁は球の外で残る。B は階段と壁の両方を球に入れる位置。両方から覗いて、どちらの球が両方に届くかを見極める。A の球は階段だけ、B の球は両方に届くことを単体で確かめる
      - 部屋3「煙突の見晴らし」（置くと先が見えない、ひねり）：屋根の間の谷に裏の橋が左右に分かれて架かり、台座は左右の屋根に1つずつ。置くと覗けないので、置く前に端から覗いて雫へ続く方を覚えておく。間違えても玉を拾えばやり直せる（罰なし）
      - 坂と部屋の並び：坂は入口の広場から東へ上り、通りの端で南へ折れて頂の煙突へ向かう（発案者の判断 2026-10-26。S-36 の閉じた門を外して続ける）。部屋2はその坂の中ほど、部屋3は頂。部屋1の雫の後にともる次の部屋の灯りと光の粒の行き先は、部屋2へ向け直す
      - エリアが現れる見せ方：エリア1を視界の中で場面に足すとき（東を見たまま坂を下りるなど）は、霞の奥からゆっくり現れるようにし、足す作業を数フレームに分けて、坂と東の道の最長フレームを目安 50ms 以下にする（S-36 の判断待ち1、発案者の判断 2026-10-26）。東を見たまま坂を下りる入力の e2e を足す
      - 近道：3つ目の雫を取ると、煙突の頂から入口の広場へ下りる裏の階段が、序章の橋と同じ光の掃きで表に定着する（S-34）。定着の範囲を複数持てるようにし、拾える例外を PickUpContext.settled へ移す（AGENTS.md の課題）。序章の橋の定着は変わらない
      - 部屋の入口ごとに次の場所が先に見える構図（ルール6）、行き止まりの理由（ルール9）、煙突の目印（ルール5）
      - e2e：通しの台本を、入口の広場 → 部屋1・2・3 → 近道 → 入口の広場まで伸ばして両経路で緑。描画呼び出しと三角形は予算内（中庭、見晴らしで覗いたとき）
      - 見た目の確認：中庭で A と B から覗いた2枚、見晴らしの谷、近道が定着するところを両経路で撮って Read で見る。最終判断は発案者
    note: エリア1を終えた後の「色が戻る」演出（中央広場へ戻ると灯塔から色の波、玉が琥珀になり「転がる」を得る、次の門が開く）と自動セーブ（雫を取ったとき、エリアに着いたとき、ポーズしたとき）は、この後の別のスライスにする。エリア1の Blender での作り込みと焼き込みも別のスライス。朝の映り込みの環境地図と、遠いガラスの霞の色を時間帯で混ぜること（core の `HazeSpec.color` を uniform に）も別のスライス（S-36 の提案6・7）。引き継ぎは `process/slices/S-36.md` の「S-40 への引き継ぎ」

