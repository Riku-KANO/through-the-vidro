    acceptance:
      - 合図：エリア1の雫が3つそろい近道が定着した後（`areaCounts().area1.taken === 3` と近道の 'settled'）、中央広場（半径約 25m）に入ると色の波が始まる。1回だけ。判定は純粋関数で単体
      - 色の波：灯塔から色の境目が距離で街全体へ広がる（約10秒、街の端 約 150m まで。2回目以降の短縮版の長さを口として持つ）。境目は光って見え、通った所から琥珀が差す。まだ行っていないエリア2・3の方角の建物にも差し、色ガラスは厚い所ほど濃い（遠景は安価な表現で）。光も暖かくなる（実時間の光と空の色の調整。焼いた物への色は Blender のエリア1の作り込みで）
      - 時間帯：エリア1を終えた後は、中央広場と街の道の空が朝（直前に終えたエリアの時間）になる。東の道を戻っても夜明け前に戻らない
      - 玉：手の玉が琥珀になる（波が手元を通ったとき）。性質「転がる」を得たことを進行に記録する（動きは M2）
      - 門：波の後、南の門（エリア2）が開く（S-41 の門と同じく光が届いて開く見せ方）。門の先は数メートルでやわらかく止まる（`allowGround`。エリア2は M2）。光の粒は南の門へ流れを変える
      - 音：色の波に仮の音（旋律が前に出る。生成音楽の層ができたら差し替える口）。部屋の時間に結びついた長い音なので `playTimed`（ポーズで止まり、再開で続く）
      - 止める：ポーズ中は波が止まる（部屋の時計）。描き直しの約束（S-42）を守る
      - 性能：波を始めた瞬間にシェーダを作らない（色を受ける材質は読み込みのときから波の uniform を持つ）。描画呼び出し 300 回以下、読み込みのフレーム（280・281、1 秒未満）を大きく増やさない。波の間に長いフレームを作らない
      - 開発用：エリア1を終えた状態で入口の広場から始めるスイッチ（例 `cleared=area1`）と、波の途中で止めて見るスイッチ（例 `colourHold=<秒>`）。先頭のコメントに書く
      - e2e（両経路）：エリア1を終えた状態から中央広場へ歩いて入ると波が始まり、約10秒で街の端まで届き、玉が琥珀、南の門が開く（`probe.colour`）。波の前後で遠くの建物の色が変わる（見えることのセンサーの差）。ポーズで波が止まる。autoplay を中央広場の波の後まで伸ばした通し（`autopilot.test.ts` を先に）。KNOWN_CONSOLE に新しい警告を足さない
      - 見た目の確認：波の途中（灯塔の方）、波の後に街の遠く（エリア2・3の方角）、琥珀の手の玉、開いた南の門を両経路で撮って Read で見る。最終判断は発案者

  - id: S-47
    title: 自動セーブとつづきから — 雫を取ったとき・エリアに着いたとき・ポーズしたときに保存し、ホームの「つづきから」で続きへ潜る
    status: todo
    depends: [S-43, S-46]
    decided: 設計書（読み込みとセーブ、細部の振る舞い「セーブの通知」、遷移の一覧「ホーム → つづきから」）と S-40 の引き継ぎ。S-42 の判断（セーブができるまではタイトルへ戻った後の「はじめる」が続きから）をこのスライスで置き換える。UI のアクセント色が街に戻った色に変わる（S-46 から移した）
    note: 受け入れ条件は S-43（保存の口と一度だけの知らせ）と S-46（色と性質の進行）の結果を見てから書く。保存するもの（取った雫、定着、開いた門、玉の場所、戻った色と性質、体の場所）と、つづきからで演出を繰り返さずに状態を戻す口（`holdShortcut` と同じ形）は S-40 の記録の引き継ぎにある
