      - process/slices/S-43.md
    acceptance:
      - パネル：曇りガラスのパネルが横に広がって開き（0.3秒）、閉じると縮んで消える。ホームの「設定」とポーズの「設定」（ポーズの項目に設計書の順で足す）から開き、背後の景色が見えたまま操作できる。タブは 画質 / 操作 / 音 / 表示とアクセシビリティ。マウス・キーボード・ゲームパッドで操作でき、Esc / B で一つ前に戻る（来たときの動きの逆再生）。入力から 0.1 秒以内に音と動きで応える
      - 即時反映：変えた設定はすぐに効き、パネル越しに見える景色で結果を確かめられる（ポーズ中は描き直しを求める。S-42 の `holdsFrame`）。品質を変えてもゲームの状態（体の位置・玉・取った雫・開いた門・定着）を失わない（今の品質の切り替えはシーンを作り直すので、作り直さずに切り替える口を作る）
      - 画質：品質（自動・低・中・高）、視野角 60〜100 度（初期 70。覗くと −6 度のまま）
      - 操作：覗く（長押し・押すたびに切り替え）、マウスの感度、上下の反転
      - 音：全体・効果音・環境音・UI の音量。core/audio に系統ごとの絞りの段を足し、ポーズの絞りと取り合わない。ポーズと設定の声も AudioGate の UI の声に数える（S-42 の提案3。S-18 の「全部の声 = UI の声＋部屋の声」がポーズ中も成り立つ）
      - 表示とアクセシビリティ：言語（日本語・English。初期値はブラウザの言語。ホーム・ポーズ・設定の文字が切り替わる）、文字の大きさ 3 段階、コントラスト強化（ガラスの縁を太く明るく、曇りガラスの背景を濃く）
      - 保存：設定はブラウザ（localStorage）に保存して次に開いたときも使う。保存できない環境でも遊べ、そのときは「この環境では保存できません」と一度だけ知らせる。読み書きの判定は純粋関数で単体
      - 性能：ポーズ中は governor に GPU 時間を渡さない（S-42 の提案4）。パネルの開閉で長いフレームを作らない
      - e2e（両経路）：ホームとポーズの両方から開き、各設定が効く（品質で描画の倍率、視野角でカメラ、音量でその系統の大きさ、言語で文字、覗くの切り替えで操作）、品質を遊ぶ途中で変えても状態が残る、再読み込みしても設定が残る、キーボードだけで操作できる。AudioContext は1つ、KNOWN_CONSOLE に新しい警告を足さない
      - 見た目の確認：ホームで開いたパネル、ポーズで開いたパネル、英語、コントラスト強化の4枚を両経路で撮って Read で見る。最終判断は発案者

