      - 炉の前の床の暖かい光が、S-31（実時間で照らしていた頃）と同じくらいに戻る（前後を同じ視点で撮って比べ、炉の前の床の範囲の暖色の量を測る）。S-27 の3つのセンサー（火の赤、扉から見たクリーム色、目覚めの右の暖かさ）は緑のまま
